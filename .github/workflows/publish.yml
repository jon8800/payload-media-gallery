name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Check that the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # `pnpm pack` applies publishConfig, so the packed package.json points at dist/.
      - name: Pack
        run: pnpm pack --pack-destination release

      # On a tag run, the packed version must equal the tag (v0.3.0 -> 0.3.0).
      # A manual run from a branch publishes the version in package.json.
      - name: Dry run
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/publish.mjs --dry-run ${TAG:+--expect-version "${TAG#v}"} release

      # Publishes with a raw authenticated PUT (see scripts/publish.mjs). `npm publish` fails on
      # this account: its 2FA is security-key-only, which collides with the CLI's OTP flow.
      # NPM_TOKEN is a granular token with "bypass 2FA". A version already on npm is skipped.
      - name: Publish
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs ${TAG:+--expect-version "${TAG#v}"} release
