name: Publish next prerelease to npm

on:
  push:
    tags:
      - 'v*-next.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm release:check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --pack-destination release

      - name: Validate packed prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/publish.mjs --dry-run --expect-version "${TAG#v}" "release/payload-media-gallery-${TAG#v}.tgz"

      - name: Publish packed prerelease to next
        env:
          TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs --expect-version "${TAG#v}" "release/payload-media-gallery-${TAG#v}.tgz"
